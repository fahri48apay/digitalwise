<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241457"/>
      <stop offset="0.5" stop-color="#3e4bbe"/>
      <stop offset="1" stop-color="#744cb0"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3e4bbe"/>
      <stop offset="1" stop-color="#744cb0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="phoneShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#0d0424" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <circle cx="1180" cy="90" r="260" fill="#ffffff" opacity="0.06" filter="url(#glow)"/>
  <circle cx="60" cy="680" r="240" fill="#bdc3ff" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1350" cy="650" r="170" fill="#d6baff" opacity="0.12" filter="url(#glow)"/>

  <!-- BRANDING (left) -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="70" height="70" rx="20" fill="#ffffff"/>
    <text x="35" y="49" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#3e4bbe" text-anchor="middle">DW</text>

    <text x="0" y="130" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-0.5">DigitalWise</text>
    <text x="0" y="172" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#d6baff">Belajar · Main · Menang 🏆</text>

    <text x="0" y="240" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#e9e7ef">
      Gamifikasi literasi digital untuk membentengi remaja
    </text>
    <text x="0" y="268" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#e9e7ef">
      dari kejahatan siber di media sosial.
    </text>

    <g transform="translate(0,320)" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600">
      <g><rect width="158" height="40" rx="20" fill="#ffffff" opacity="0.14"/><text x="79" y="26" fill="#fff" text-anchor="middle">🎯 Misi &amp; Level</text></g>
      <g transform="translate(170,0)"><rect width="158" height="40" rx="20" fill="#ffffff" opacity="0.14"/><text x="79" y="26" fill="#fff" text-anchor="middle">🛡️ Anti-Phishing</text></g>
      <g transform="translate(340,0)"><rect width="158" height="40" rx="20" fill="#ffffff" opacity="0.14"/><text x="79" y="26" fill="#fff" text-anchor="middle">🏅 Badge &amp; XP</text></g>
    </g>

    <!-- mini stat pills -->
    <g transform="translate(0,400)" font-family="Arial,Helvetica,sans-serif">
      <text x="0" y="22" font-size="30" font-weight="800" fill="#ffffff">22</text>
      <text x="64" y="22" font-size="13" fill="#c6c5d0">board desain</text>
      <text x="150" y="22" font-size="30" font-weight="800" fill="#ffffff">74</text>
      <text x="214" y="22" font-size="13" fill="#c6c5d0">interaksi</text>
      <text x="290" y="22" font-size="30" font-weight="800" fill="#ffffff">AA</text>
      <text x="336" y="22" font-size="13" fill="#c6c5d0">kontras WCAG</text>
    </g>
  </g>

  <!-- PHONE 1: Beranda (light) - left -->
  <g transform="translate(600,40)" filter="url(#phoneShadow)">
    <rect width="332" height="690" rx="48" fill="#18181f"/>
    <rect x="8" y="8" width="316" height="674" rx="40" fill="#000"/>
    <image x="16" y="16" width="300" height="650" xlink:href="beranda.png" preserveAspectRatio="xMidYMid slice"/>
    <rect x="134" y="676" width="64" height="5" rx="2.5" fill="#8a8a94"/>
  </g>

  <!-- PHONE 2: Phishing - center (main) -->
  <g transform="translate(975,12)" filter="url(#phoneShadow)">
    <rect width="360" height="740" rx="52" fill="#18181f"/>
    <rect x="9" y="9" width="342" height="722" rx="44" fill="#000"/>
    <image x="18" y="18" width="324" height="702" xlink:href="phishing.png" preserveAspectRatio="xMidYMid slice"/>
    <rect x="146" y="726" width="68" height="5" rx="2.5" fill="#8a8a94"/>
  </g>
</svg>
